  var C={ctx:null,audio:null,src:null,master:null,analyser:null,tapAn:null,chains:{},url:"",
  zeroWins:0,checks:0,tsum:0,tsq:0,tn:0,taintReported:false,errReported:false,lastState:null,helloSent:false,
  pausedMs:0,stallSent:false};

  // AudioContext - a second context next to the programme's, so a fan cannot
  // colour the music and the two are summed by the device rather than mixed
  // in the graph. The mode is read from the panel's own URL; this instance
  // never decodes the programme and never builds a cabinet chain.
  var SFX_MODE=false;

// Any uncaught error must reach Lua: a dead page must never look healthy.
window.onerror=function(m,s,l,c){ try{ ntxReport({t:"jserror",msg:String(m).slice(0,180),line:l||0}); }catch(e){} };
function ntxReport(o){ try{ ntx.status(JSON.stringify(o)); }catch(e){} }
function ensureCtx(){
  if(C.ctx) return true;

//
// The buses are band-specific, so one figure measured across the whole
// programme cannot tell a MID channel from a SUB one: both would be handed the
// same load and the same meter reading even though the page filters them apart
// moments later. Each side is measured twice - above and below the same 80 Hz
// crossover the cabinet chains use - and the mono sum is measured too, so
// SubMono is a genuine band-limited sum rather than a relabelled side.
function bq2(ctx,type){
  var a=ctx.createBiquadFilter(); a.type=type; a.frequency.value=80; a.Q.value=0.7071;
  var b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=80; b.Q.value=0.7071;
  a.connect(b);

}
function buildBands(){
  var ctx=C.ctx;
  var mL=bq2(ctx,"highpass"), mR=bq2(ctx,"highpass");
  var sL=bq2(ctx,"lowpass"),  sR=bq2(ctx,"lowpass");
  var sM=bq2(ctx,"lowpass");

  C.split.connect(sL[0],0,0); C.split.connect(sR[0],1,0);
  C.mono.connect(sM[0],0,0);

  var defs=[["midL",mL],["midR",mR],["subL",sL],["subR",sR],["subMono",sM]];

    defs[i][1][1].connect(an);

  // outputs into the merger's single input is what makes SubMono a real mono

}
// Frame-rate independent exponential smoothing: cur += (tgt-cur)*(1-e^(-dt/tau)).

// speakers or the listener move: 10-15 Hz staircases became continuous.
function smoothVec(cur,tgt,dt,maxRate){
  var a=1-Math.exp(-dt/(C.smoothMs/1000));

  var ny=cur[1]+(tgt[1]-cur[1])*a;
  var nz=cur[2]+(tgt[2]-cur[2])*a;

      // turning the camera (moving was fine: only the orientation moved).

          cl.positionZ.setTargetAtTime(pc[2],tNow,lt);
          cl.forwardX.setTargetAtTime(fx,tNow,lt);
          cl.forwardY.setTargetAtTime(fy,tNow,lt);
          cl.forwardZ.setTargetAtTime(fz,tNow,lt);
          cl.upX.setTargetAtTime(ux,tNow,lt);
          cl.upY.setTargetAtTime(uy,tNow,lt);
          cl.upZ.setTargetAtTime(uz,tNow,lt);
        } else {
          cl.positionX.value=pc[0]; cl.positionY.value=pc[1]; cl.positionZ.value=pc[2];
          cl.forwardX.value=fx; cl.forwardY.value=fy; cl.forwardZ.value=fz;
          cl.upX.value=ux; cl.upY.value=uy; cl.upZ.value=uz;
        }

      }
    }catch(e){}

    var ch=C.chains[id];

      var p=ch.cur;
      if(ch.pn.positionX){ ch.pn.positionX.value=p[0]; ch.pn.positionY.value=p[1]; ch.pn.positionZ.value=p[2]; }
      else{ ch.pn.setPosition(p[0],p[1],p[2]); }
    }catch(e){}
  }
}
function ntxPing(){ ntxReport({t:"pong"}); }
// How often the page reports source RMS. The Lua side sets this from the
// cadence the server assigned to this client: a player who owns an amplifier
// needs every tick, anyone else is fine at a quarter of that. Reporting
// faster than the consumer can use is wasted bridge traffic, and slower than
// it needs makes the model lag the music.
// Band-limited source sampler, on its own timer.
//
// This used to run inside ntxUpdate, which only fires when Lua pushes state -
// capped by ntx_push_hz, 15 Hz by default. The server assigns a per-player
// cadence and pushes it here as RMS_GATE, but a gate cannot raise the ceiling:
// the sample simply never happened between pushes. The simulation inherits
// that cap because it consumes these numbers, so meters and load followed the
// music at 15 Hz no matter what cadence was set.
//
// RMS_GATE still decides when to actually report, so ntxSetMeterInterval keeps
// working and the timer is not rebuilt when the cadence changes.
var BAND_KEYS=["midL","midR","subL","subR","subMono"];
function analyserRms(an){
  var b=new Uint8Array(an.fftSize), q=0;
  an.getByteTimeDomainData(b);

function reportBands(){

    if(!C.ctx||!C.band) return;

      var an=C.band[BAND_KEYS[i]];

    // One level per BUS, in bus order, each already band-limited: this is what
    // the amplifier's load and meters read, so it has to carry the same shape
    // as the buses themselves. A MID channel is measured from the MID band,
    // not from the whole programme.
    ntxReport({t:"rms",b:bv,c:C.clipSeen||0});
    C.clipSeen=0;
  }catch(e){}
}

var RMS_GATE=0.05;
function ntxSetMeterInterval(secs){
  var s=parseFloat(secs);

  // above a second is slower than any consumer wants.
  if(isFinite(s)&&s>0.002&&s<1){ RMS_GATE=s; }
  return RMS_GATE;
}
// Boot handshake: proves this script parsed and ran, and retries until the
// Lua bridge exists. Without it a parse error is indistinguishable from a
// quiet page, because the onerror handler lives in the broken script too.
var hbTries=0;
var hbIv=setInterval(function(){
  try{ if(window.ntx&&ntx.status){ C.helloSent=true; ntxReport({t:"hello",v:5}); clearInterval(hbIv); return; } }catch(e){}
  if(++hbTries>24) clearInterval(hbIv);
},500);
function playAudio(){
  if(!C.audio) return;
  var nowMs=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();

  // hammering it every push is still wasteful: 2 s gate.
  if(C.lastPlayTry&&nowMs-C.lastPlayTry<2000) return;
  C.lastPlayTry=nowMs;

}
function ntxResume(){

function setUrl(u){
  if(u===C.url) return;
  C.url=u; C.taintReported=false; C.zeroWins=0; C.checks=0; C.tsum=0; C.tsq=0; C.tn=0;

  if(!ensureCtx()) return;
  if(C.src){ try{C.src.disconnect();}catch(e){} C.src=null; }
  C.audio=new Audio(); C.audio.crossOrigin="anonymous"; C.audio.preload="auto";
  try{ C.src=C.ctx.createMediaElementSource(C.audio); }
  catch(e){ ntxReport({t:"error",err:"mes-fail"}); return; }

  // (CORS taint / dead air) from "chains eat the signal" downstream.
  try{ C.src.connect(C.tapAn); }catch(e){}
  // Split edges are per-source: a new MediaElementSource means a new node, so
  // these have to be rebuilt with it or every side-selecting tap goes silent.
  // Only the source edge is per-source. The splitter's own outputs are wired
  // once in ensureCtx and left alone; the previous source node is discarded
  // with it, so there is nothing to disconnect here.

  // directly. A dry src->master connection would play the unfiltered stereo

function buildChain(kind,side){

  else{ a1=bq("highpass"); a2=bq("highpass"); }

  // line of sight, swept down when a wall/pillar is in the way. Wired
  // permanently rather than reconnected on change: connect/disconnect churn
  // on a live tap is itself a click.

  // one push interval before the commanded gain ramps in.

  a1.connect(a2); a2.connect(occ); occ.connect(sh); sh.connect(g); g.connect(dl); dl.connect(pol); pol.connect(pn); pn.connect(C.master);

  // per-stage energy, so a silent master can be blamed on filters vs pan.
  var anFQ=C.ctx.createAnalyser(); anFQ.fftSize=256; a2.connect(anFQ);

  ch.side=(typeof side==="number")?side:undefined;

// y = tanh(k*x)/tanh(k): a hard limiter's smooth cousin, normalised so a signal
// below clip keeps its level. k == 1 passes almost untouched, so the curve is
// only rebuilt when the amplifier is actually clipping.
function identityCurve(n){ var c=new Float32Array(n); for(var i=0;i<n;i++){ c[i]=i/(n-1)*2-1; } return c; }
function clipCurve(n,k){
  var c=new Float32Array(n), den=Math.tanh(k);
  for(var i=0;i<n;i++){ var x=i/(n-1)*2-1; c[i]=Math.tanh(k*x)/den; }
  return c;

function setClip(ch,k){

  // far enough to hear, which during a clip burst is a couple of times a second.
  if(Math.abs(k-ch.drive)<0.15 && ch.sh.curve!==null) return;
  ch.drive=k;
  try{ ch.sh.curve=clipCurve(1024,k); }catch(e){}
}
// Amplifier fan noise. It sits at the amplifier output, so it sums into the
// master bus rather than into a cabinet chain. Mains hum was removed outright.
function ampNodes(){
  if(C.fan) return;

  var len=C.ctx.sampleRate*2, buf=C.ctx.createBuffer(1,len,C.ctx.sampleRate), dat=buf.getChannelData(0);
  for(var i=0;i<len;i++){ dat[i]=Math.random()*2-1; }

  var fanLp=C.ctx.createBiquadFilter(); fanLp.type="lowpass"; fanLp.frequency.value=900; fanLp.Q.value=0.4;

function applyAmpAudio(a){
  // No payload means this page is not the amplifier's owner. Ramp to silence if
  // the nodes exist, but never create them: an 8|600 rig would otherwise carry a
  // noise buffer per input for nothing.
  if(!a){
    if(C.fan){ try{ C.fan.gain.gain.setTargetAtTime(0,C.ctx.currentTime,0.3); }catch(e){} }
    return;
  }
  ampNodes();
  var t=C.ctx.currentTime;
  var fdb=(a&&a.fan)?a.fan.db:-120;

// Chains are built before (or survive across) source (re)creation, and a

// into a chain head. Without it the filters process dangling silence.
// Where this chain takes its input from. side is the bus's pick: 0 left only,
// 1 right only, 2 both summed. Anything else means the tap has no bus and gets
// the full source exactly as before, which is what keeps active cabinets and
// the BASS fallback unaffected.
function chainSrc(ch){
  if(!C.src||!ch) return null;
  var sd=ch.side;
  if(sd===0||sd===1){ return C.split?[C.split,sd]:null; }
  if(sd===2){ return C.mono?[C.mono,0]:null; }

function wireChain(ch){

  var n=chainSrc(ch); if(!n) return;

    n[0].connect(ch.a1,n[1],0);
    // Recorded, not recomputed. dropChain used to derive the node from
    // ch.side, which by then was the NEW side - so changing a cabinet's bus
    // disconnected the output it was not on and left the old edge live.
    ch.srcNode=n[0]; ch.srcOut=n[1];

}
function dropChain(ch){

}
// Gains ride setTargetAtTime so 10 Hz Lua pushes never zipper-click
// (Glide engine_stream pattern: smooth param motion in-page).
function smooth(param,v){ try{ param.setTargetAtTime(v,C.ctx.currentTime,0.05); }catch(e){ try{param.value=v;}catch(x){} } }

  // pre-gesture) restarts on its own; the 2 s gate inside playAudio() keeps
  // this push-rate-safe.

    if(C.audio&&C.audio.paused&&C.ctx.state==="running"){

      // Still stuck after 8 s of pushes: a page this old cannot start the
      // element at all (stale hosted file). Tell Lua so it can fall back.
      if(C.pausedMs>8000&&!C.stallSent){ C.stallSent=true; ntxReport({t:"stalled"}); }
    } else if(C.audio&&!C.audio.paused){ C.pausedMs=0; C.stallSent=false; }
  }catch(e){}
  // Contract handshake: remotely hosted copies can skew behind addon
  // updates; Lua warns instead of driving an unknown page blind.
  if(!C.helloSent){ C.helloSent=true; ntxReport({t:"hello",v:5}); }
  if(!s||!s.url) return;
  if(s.url!==C.url) setUrl(s.url);
  // Limiter is a safety net, not a compressor: -0.5 dBFS / 20:1 in practice,
  // and fully transparent (ratio 1) when the operator disables it.
  try{
    var limOn=(s.lim===1||s.lim===true);
    C.comp.ratio.value=limOn?20:1;
    C.comp.threshold.value=limOn?(typeof s.limDb==="number"?s.limDb:-0.5):0;
    C.comp.attack.value=0.001; C.comp.release.value=0.25;
  }catch(e){}
  try{
    if(typeof s.smoothMs==="number") C.smoothMs=Math.max(0,s.smoothMs);
    if(typeof s.maxRate==="number") C.maxRate=Math.max(0,s.maxRate);
  }catch(e){}
  try{
    var L=s.listener;
    C.listenerTgt={ p:[L.px,L.py,L.pz], f:[L.fx,L.fy,L.fz], u:[(typeof L.upx==="number"?L.upx:0),(typeof L.upy==="number"?L.upy:0),(typeof L.upz==="number"?L.upz:1)] };
    if(!C.listenerCur){ C.listenerCur={ p:C.listenerTgt.p.slice(), f:C.listenerTgt.f.slice(), u:C.listenerTgt.u.slice() }; }
    else if(!C.listenerCur.u){ C.listenerCur.u=C.listenerTgt.u.slice(); }
  }catch(e){}
  var seen={},i,d,ch,gsum=0,clipSeen=0;
  for(i=0;i<s.sp.length;i++){ d=s.sp[i]; seen[d.id]=1; ch=C.chains[d.id]; gsum+=d.g;
    // side is part of the chain's identity, not just an edge: a cabinet that
    // moves from MidL to SubMono has to be rewired, and reusing the chain would
    // leave it fed from the old splitter output.
    if(!ch||ch.kind!==d.kind||ch.side!==d.side){
      if(ch) dropChain(ch);
      ch=buildChain(d.kind, d.side);
      C.chains[d.id]=ch;
    }
    wireChain(ch);
    // Amplifier flat-topping. Optional field: a tap from an older page never
    // carries it and the shaper simply stays transparent.
    var cl=(typeof d.cl==="number")?d.cl:1;
    if(cl>1.02) clipSeen=1;
    try{ setClip(ch,cl); }catch(e){}
    try{
      smooth(ch.g.gain,d.g); ch.lastG=d.g;
      // Occlusion cutoff rides the same ramp as the gain: a hard frequency
      // step on the filter is an audible sweep-click.
      var oc=(typeof d.occlp==="number")?d.occlp:20000;
      if(ch.occ){ try{ ch.occ.frequency.setTargetAtTime(Math.max(60,Math.min(20000,oc)),C.ctx.currentTime,0.08); }catch(e){} }
      ch.dl.delayTime.value=d.d/1000; ch.pol.gain.value=d.inv?-1:1;
      ch.pn.refDistance=300; ch.pn.maxDistance=d.maxd; ch.pn.rolloffFactor=1;
      ch.pn.coneInnerAngle=d.ci; ch.pn.coneOuterAngle=d.co; ch.pn.coneOuterGain=d.cov;
      // Position becomes a TARGET; motionFrame() chases it smoothly.
      var tp=[d.px,d.py,d.pz];
      if(!ch.tgt){ ch.tgt=tp; ch.cur=tp.slice(); }
      else{ ch.tgt[0]=tp[0]; ch.tgt[1]=tp[1]; ch.tgt[2]=tp[2]; }
    }catch(e){}
  }
  for(var id in C.chains){ if(!seen[id]){ dropChain(C.chains[id]); delete C.chains[id]; } }
  // Normalisation: Lua computes one factor across every open page/tap
  // (pages are separate AudioContexts that sum at the OS device, so a page
  // cannot see its siblings). Fall back to this page's own sum if absent.
  try{
    var target=(typeof s.norm==="number")?s.norm:(gsum>1?(1/Math.sqrt(gsum)):1);
    target=Math.max(0.12,Math.min(1,target));
    smooth(C.master.gain,target);
  }catch(e){}
  // Taint sampling only counts while taps are actually commanded audible:
  // a muted/gainless rig reads as analyser silence too, which is not CORS.
  // Tap mean/variance separates the three silences: exact digital zeros
  // (CORS taint OR true silence), DC-offset dead air (nonzero mean, ~zero
  // variance — inaudible, and correctly stripped by the highpass chains),
  // and real energy vanishing downstream (chain bug, never the source).
  if(gsum<=0.001){ C.checks=0; C.zeroWins=0; C.tsum=0; C.tsq=0; C.tn=0; }
  else try{
    if(C.audio&&C.audio.readyState>1&&!C.audio.paused&&C.audio.currentTime>0.5){
      C.clipSeen=clipSeen;
      if(!C.taintReported){
      var buf=new Uint8Array(C.analyser.fftSize);
      C.analyser.getByteTimeDomainData(buf);
      var sum=0,k; for(k=0;k<buf.length;k++){ sum+=Math.abs(buf[k]-128); }
      var ssum=0; try{
        var tbuf=new Uint8Array(C.tapAn.fftSize);
        C.tapAn.getByteTimeDomainData(tbuf);
        for(k=0;k<tbuf.length;k++){ ssum+=Math.abs(tbuf[k]-128); C.tsum+=tbuf[k]; C.tsq+=tbuf[k]*tbuf[k]; C.tn++; }
      }catch(e){}
      C.checks++; if(sum===0){ C.zeroWins++; }
      if(C.checks>=30){
        if(C.zeroWins===C.checks){
          C.taintReported=true;
          var mean=C.tn>0?(C.tsum/C.tn):128;
          var variance=C.tn>0?(C.tsq/C.tn-mean*mean):0;
          // Bisect: energy right after the filters and right after the
          // panner, first chain only. Pinpoints the eating node.
          var fqSum=0,panSum=0,lastG=0;
          try{
            var ids=Object.keys(C.chains);
            if(ids.length>0){
              var c0=C.chains[ids[0]]; lastG=c0.lastG||0;
              var fb=new Uint8Array(256); c0.anFQ.getByteTimeDomainData(fb);
              for(var m=0;m<fb.length;m++){ fqSum+=Math.abs(fb[m]-128); }
              var pb=new Uint8Array(256); c0.anPan.getByteTimeDomainData(pb);
              for(var q=0;q<pb.length;q++){ panSum+=Math.abs(pb[q]-128); }
            }
          }catch(e){}
          ntxReport({t:"tainted",srcAudible:ssum>0,srcMean:Math.round(mean*10)/10,srcVar:Math.round(variance*100)/100,chains:Object.keys(C.chains).length,fq:Math.round(fqSum),pan:Math.round(panSum),g:lastG});
        }
        C.checks=0; C.zeroWins=0; C.tsum=0; C.tsq=0; C.tn=0; }
      }
    }
  }catch(e){}
  // Amplifier fan, refreshed on every push so a rig that is switched off
  // (or whose page lost the amplifier) goes quiet instead of droning forever.
  try{ applyAmpAudio(s.amp); }catch(e){}
}

// ------------------------------------------------------------ amplifier SFX
//
// One noise source per amplifier, filtered and panned at the amplifier's own
// position, and buried under the programme. The burial is the point: a fan in
// the next room is inaudible against a PA, and an amp SFX mix that ignores the
// programme sounds like it is inside the listener's head.
function sfxEnsure(){
  if(C.sfx) return;
  if(!ensureCtx()) return;
  var ctx=C.ctx;
  var s={master:ctx.createGain(),amps:{}};
  s.master.gain.value=1;
  s.master.connect(ctx.destination);
  var len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++){ d[i]=Math.random()*2-1; }
  s.noise=buf;
  C.sfx=s;
}

function sfxAmp(a){
  var s=C.sfx;
  if(!s) return;
  var e=s.amps[a.id];
  if(!e){
    var ctx=C.ctx;
    var src=ctx.createBufferSource(); src.buffer=s.noise; src.loop=true;
    var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=0.4;
    var g=ctx.createGain(); g.gain.value=0;
    var pan=ctx.createPanner();
    pan.panningModel="HRTF"; pan.distanceModel="inverse"; pan.refDistance=300; pan.rolloffFactor=1;
    src.connect(lp); lp.connect(g); g.connect(pan); pan.connect(s.master);
    try{ src.start(ctx.currentTime); }catch(e){}
    e={src:src,lp:lp,g:g,pan:pan};
    s.amps[a.id]=e;
  }
  var t=C.ctx.currentTime;
  // The fan's pitch follows the motor, so it is not a hiss that only changes
  // in level.
  var rpm=Math.max(Number(a.rpm)||0,0);
  e.lp.frequency.setTargetAtTime(500+Math.min(rpm/3200,1)*1400,t,0.3);
  var db=Number(a.db);
  e.g.gain.setTargetAtTime(db>-100?Math.pow(10,db/20):0,t,0.3);
  if(e.pan.positionX){
    e.pan.positionX.setTargetAtTime(Number(a.x)||0,t,0.05);
    e.pan.positionY.setTargetAtTime(Number(a.y)||0,t,0.05);
    e.pan.positionZ.setTargetAtTime(Number(a.z)||0,t,0.05);
  }else{ try{ e.pan.setPosition(Number(a.x)||0,Number(a.y)||0,Number(a.z)||0); }catch(e){} }
}

// The bridge. Lua pushes the amplifier list, the listener and the programme
// level; the page does the rest.
function ntxSfx(s){
  try{
    sfxEnsure();
    if(!C.sfx) return;
    var t=C.ctx.currentTime;
    var list=(s&&s.amps)||[];
    for(var i=0;i<list.length;i++) sfxAmp(list[i]);
    // An amplifier that has gone away must stop making noise.
    for(var id in C.sfx.amps){
      if(!C.sfx.amps[id].seen){ }
    }
    for(var i=0;i<list.length;i++){ C.sfx.amps[list[i].id].seen=true; }
    for(var id in C.sfx.amps){
      if(!C.sfx.amps[id].seen){
        try{ C.sfx.amps[id].g.gain.setTargetAtTime(0,t,0.3); }catch(e){}
        C.sfx.amps[id].seen=false;
      }
    }
    // Buried under the programme. The louder the music, the less of the fan
    // reaches the listener - which is what actually happens, and what makes the
    // fan sit in the room instead of on top of it.
    var prog=Math.max(Number(s&&s.prog)||0,0);
    var progDb=prog>0?20*Math.log(prog)/Math.log(10):-120;
    var mask=progDb-(-30);
    var duck=Math.max(0,Math.min(1,1-mask/24));
    C.sfx.master.gain.setTargetAtTime(duck,t,0.2);
    // The listener, so the fan is heard from where the player is.
    if(s&&s.listener){
      var L=s.listener;
      var cl=C.ctx.listener, p=[L.px||0,L.py||0,L.pz||0], f=[L.fx||0,L.fy||0,L.fz||0], u=[L.ux||0,L.uy||0,L.uz||1];
      if(cl.positionX){
        cl.positionX.setTargetAtTime(p[0],t,0.05);
        cl.positionY.setTargetAtTime(p[1],t,0.05);
        cl.positionZ.setTargetAtTime(p[2],t,0.05);
        cl.forwardX.setTargetAtTime(f[0],t,0.05);
        cl.forwardY.setTargetAtTime(f[1],t,0.05);
        cl.forwardZ.setTargetAtTime(f[2],t,0.05);
        cl.upX.setTargetAtTime(u[0],t,0.05);
        cl.upY.setTargetAtTime(u[1],t,0.05);
        cl.upZ.setTargetAtTime(u[2],t,0.05);
      }else{
        try{ cl.setPosition(p[0],p[1],p[2]); cl.setOrientation(f[0],f[1],f[2],u[0],u[1],u[2]); }catch(e){}
      }
    }
  }catch(e){}
}
